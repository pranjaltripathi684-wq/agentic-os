name: Release

# Push a tag like v1.0.0 to publish: tests run again, then the wheel and source
# archive go on a GitHub Release, and the sandbox image goes to GitHub's container
# registry (ghcr.io/<owner>/agentos-sandbox).

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write          # create the release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: The tag must match the version in pyproject.toml
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match version $version in pyproject.toml"; exit 1
          fi
      - name: Test before releasing
        run: |
          sudo apt-get update && sudo apt-get install -y bubblewrap
          pip install -e ".[all]"
          ruff check . && mypy agentos && pytest -q
      - name: Build
        run: python -m build
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # release notes = this version's section of CHANGELOG.md
          awk -v v="${GITHUB_REF_NAME#v}" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" dist/* --title "Agentic OS $GITHUB_REF_NAME" --notes-file notes.md

  sandbox-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write          # push to ghcr.io
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: sandbox
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/agentos-sandbox:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/agentos-sandbox:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Sandbox image for Agentic OS: Debian slim with common CLI tools, non-root user
